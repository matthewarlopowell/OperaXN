[build-system]
requires = [
    "hatchling>=1.6.0",
]
build-backend = "hatchling.build"

[project]
name = "OperaXN"
version = "2.0.0"
description = "Visualise operando diffraction experiments and produce standardised nexus files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.9"
authors = [
    { name = "Matthew A. Powell", email = "Matt.Powell@warwick.ac.uk" },
    { name = "Gabriel E. Perez", email = "gabriel.perez@stfc.ac.uk" },
    { name = "Tobias A. Bird", email = "tobias.bird@diamond.ac.uk" },
    { name = "Gaurav C. Pandey", email = "Gaurav.Pandey@warwick.ac.uk" },
    { name = "José J. Arroyo-Gómez", email = "josej.arroyog@gmail.com" },
    { name = "Steven Huband", email = "S.Huband@warwick.ac.uk" },
    { name = "Sarah J. Day", email = "sarah.day@diamond.ac.uk" },
    { name = "Louis F. J. Piper", email = "Louis.Piper@warwick.ac.uk" },
    { name = "Ashok S. Menon", email = "Ashok.Menon@warwick.ac.uk" },
]

maintainers = [
    { name = "Matthew A. Powell", email = "Matt.Powell@warwick.ac.uk" },
    { name = "Tobias A. Bird", email = "tobias.bird@diamond.ac.uk" },
    { name = "Ashok S. Menon", email = "Ashok.Menon@warwick.ac.uk" },
]

keywords = [
    "operando", "diffraction", "XRD", "neutron", "electrochemistry",
    "NeXus", "visualisation", "synchrotron",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=2.0.0",
    "h5py>=3.0.0",
    "fabio>=0.14.0",
    "matplotlib>=3.4.0",
    "openpyxl>=3.0.0",
    "psutil>=5.8.0",
    "imageio>=2.9.0",
]

[project.urls]
Repository = "https://github.com/matthewarlopowell/OperaXN"
"Bug Tracker" = "https://github.com/matthewarlopowell/OperaXN/issues"

[project.scripts]
operaxn = "operaxn.main:main"

[tool.hatch.build.targets.wheel]
packages = ["bin/core", "bin/operaxn"]

[tool.hatch.build.targets.wheel.sources]
"bin/core" = "core"
"bin/operaxn" = "operaxn"

[tool.hatch.build.targets.sdist]
include = ["bin/core", "bin/operaxn", "definitions", "LICENSE", "README.md"]
