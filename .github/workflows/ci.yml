name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .[test]
      # OPERAXN_REQUIRE_VALIDATION turns "pynxtools validation unavailable"
      # from a silent skip into a failure, so the NeXus schema checks can
      # never quietly drop out of a run.
      - run: pytest -m "not display and not realdata"
        env:
          OPERAXN_REQUIRE_VALIDATION: "1"

  gui-display:
    name: GUI display tests (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install .[test]
      # Fail loudly if Tk cannot reach the virtual display, so the display
      # tests cannot all skip while the job stays green.
      - run: xvfb-run -a bash -c 'python -c "import tkinter; tkinter.Tk().destroy()" && pytest -m "not realdata"'
        env:
          OPERAXN_REQUIRE_VALIDATION: "1"

